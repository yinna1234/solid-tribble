name: Fetch data & deploy Pages

on:
  push:
    branches: [main] # push 到 main 即自动部署(改 site/ 不用再手动 Run)
  schedule:
    - cron: '7,17,27,37,47,57 * * * *' # 每10分钟一次,错开整点高峰,降低被 GitHub 调度器丢班次的概率
  workflow_dispatch: {} # 支持手动触发,兜底用

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip # 缓存 pip 下载,省几秒
          cache-dependency-path: scripts/requirements.txt

      # 缓存 Playwright 的 chromium(约160MB),命中后跳过下载,是提速大头
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install deps
        run: |
          pip install -r scripts/requirements.txt
          # 浏览器已命中缓存时此步只补系统依赖,秒级完成;未命中才完整下载
          playwright install --with-deps chromium

      - name: Fetch tables
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: python scripts/fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F)"
          # 两次运行可能前后脚完成:先 rebase 远端最新提交再推。
          # -X theirs = 冲突时采用本次运行的数据(rebase 中 theirs 指本运行的新提交):
          # 两次运行都整文件重写 JSON(含 updated_at),必然内容冲突,自动合并解不掉,
          # 必须显式给策略,否则 rebase 卡死整次运行失败。后完成者数据更新,以其为准。
          git pull --rebase -X theirs origin main
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
