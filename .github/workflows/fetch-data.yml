name: Fetch data & deploy Pages

on:
  push:
    branches: [main] # push 到 main 即自动部署(改 site/ 不用再手动 Run)
  schedule:
    # 每 10 分钟一次,错开整点高峰,降低被 GitHub 调度器丢班次的概率
    - cron: '7,17,27,37,47,57 * * * *'
    # 每天一次:只抓「门店每日数据」。cron 用 UTC —— 北京时间 02:00 = UTC 前一天 18:00。
    # 单独一条 cron 而不是独立 workflow:两条 workflow 共用并发组时,排队中的那条会被
    # 后来的挤掉(cancelled),凌晨这次很容易跑不起来;合并成一条就只有一种队列,不会被取消。
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 抓取模式
        required: true
        default: both
        type: choice
        options: [both, main, daily]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 本次跑哪种模式(放在 workflow 级,Commit 步骤的提交信息也要用到):
  #   daily → 命中 '0 18 * * *'(北京 02:00),只抓「门店每日数据」1 张表
  #   main  → 其余每 10 分钟的班次,只抓主页面 6 张表,不碰 daily.json
  #   手动触发 → 用下拉框选的 mode(默认 both)
  # 「门店每日数据」是全表最大(235 行,约占 7 表总量 62%),而曲线只需要它的历史点
  # (今日点已改由门店表「今日业绩」列实时提供,随 10 分钟一刷更新),所以把它降频到每天一次。
  FETCH_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '0 18 * * *' && 'daily' || 'main') }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip # 缓存 pip 下载,省几秒
          cache-dependency-path: scripts/requirements.txt

      # 缓存 Playwright 的 chromium(约160MB),命中后跳过下载,是提速大头
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install deps
        run: |
          pip install -r scripts/requirements.txt
          # 浏览器已命中缓存时此步只补系统依赖,秒级完成;未命中才完整下载
          playwright install --with-deps chromium

      - name: Fetch tables
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
        run: python scripts/fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          git diff --cached --quiet || git commit -m "data: $FETCH_MODE update $(date -u +%F' '%H:%M)"
          # 两次运行可能前后脚完成:先 rebase 远端最新提交再推。
          # -X theirs = 冲突时采用本次运行的数据(rebase 中 theirs 指本运行的新提交):
          # 两次运行都整文件重写 JSON(含 updated_at),必然内容冲突,自动合并解不掉,
          # 必须显式给策略,否则 rebase 卡死整次运行失败。后完成者数据更新,以其为准。
          git pull --rebase -X theirs origin main
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
