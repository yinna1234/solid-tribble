name: Fetch daily performance (once per day)

# 「门店每日数据」专用:全表最大(235 行,占 7 张表总量约 62%),但曲线只需要它的历史点
# (今日点已改由门店表「今日业绩」列实时提供,随主流程 10 分钟一刷),
# 所以这里降频到每天一次,主流程 fetch-data.yml 每 10 分钟只跑剩下 6 张小表。
on:
  schedule:
    # cron 用 UTC:北京时间 02:00 = UTC 前一天 18:00
    - cron: '0 18 * * *'
  workflow_dispatch: {} # 手动补跑兜底

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages # 与主流程共用,串行化,避免两条流程同时 git push 互相拒绝
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install deps
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Fetch daily table
        env:
          BI_USER: ${{ secrets.BI_USER }}
          BI_PASS: ${{ secrets.BI_PASS }}
          FETCH_MODE: daily
        run: python scripts/fetch_data.py

      - name: Commit daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交本流程负责的文件,主流程的 6 张表不碰
          git add site/data/daily.json
          git diff --cached --quiet || git commit -m "data: daily $(date -u +%F)"
          # 主流程每 10 分钟提交一次,这里可能撞车:先 rebase 再推。
          # -X theirs:两条流程都是整文件重写 JSON(含 updated_at),必然内容冲突,
          # 必须显式给策略,否则 rebase 卡死导致整次运行失败。
          git pull --rebase -X theirs origin main
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
